<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">FMEA Risk Lens Framework</title>
  <desc id="desc">Three color coded lenses for severity, occurrence, and detection that lead to four engineering response lanes.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162E"/>
      <stop offset="1" stop-color="#123B5D"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1400" height="650" rx="28" fill="#F4F8FB"/>
  <rect x="0" y="0" width="1400" height="92" rx="28" fill="url(#navy)"/>
  <rect x="0" y="64" width="1400" height="28" fill="url(#navy)"/>
  <text x="56" y="58" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">FMEA Risk Lens</text>
  <text x="1040" y="57" fill="#A9E9E2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">EVIDENCE BEFORE SCORE</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(70,145)">
      <rect width="360" height="300" rx="26" fill="#FFFFFF" stroke="#E63946" stroke-width="4"/>
      <circle cx="180" cy="84" r="56" fill="#E63946"/>
      <text x="180" y="96" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="900">S</text>
      <text x="180" y="171" text-anchor="middle" fill="#0D2F4F" font-size="26" font-weight="800">SEVERITY</text>
      <text x="180" y="207" text-anchor="middle" fill="#536675" font-size="18">What happens at the vehicle,</text>
      <text x="180" y="234" text-anchor="middle" fill="#536675" font-size="18">customer, or safety-goal level?</text>
      <rect x="54" y="260" width="252" height="30" rx="15" fill="#FDEBED"/>
      <text x="180" y="281" text-anchor="middle" fill="#B21F2D" font-size="15" font-weight="800">IMPACT CANNOT BE INSPECTED AWAY</text>
    </g>
    <g transform="translate(520,145)">
      <rect width="360" height="300" rx="26" fill="#FFFFFF" stroke="#FFB000" stroke-width="4"/>
      <circle cx="180" cy="84" r="56" fill="#FFB000"/>
      <text x="180" y="96" text-anchor="middle" fill="#182638" font-size="42" font-weight="900">O</text>
      <text x="180" y="171" text-anchor="middle" fill="#0D2F4F" font-size="26" font-weight="800">OCCURRENCE</text>
      <text x="180" y="207" text-anchor="middle" fill="#536675" font-size="18">How credible is the cause, based on</text>
      <text x="180" y="234" text-anchor="middle" fill="#536675" font-size="18">design, test, process, and field evidence?</text>
      <rect x="48" y="260" width="264" height="30" rx="15" fill="#FFF4D6"/>
      <text x="180" y="281" text-anchor="middle" fill="#8A5C00" font-size="15" font-weight="800">USE DATA, NOT MEMORY OR INSTINCT</text>
    </g>
    <g transform="translate(970,145)">
      <rect width="360" height="300" rx="26" fill="#FFFFFF" stroke="#2EC4B6" stroke-width="4"/>
      <circle cx="180" cy="84" r="56" fill="#2EC4B6"/>
      <text x="180" y="96" text-anchor="middle" fill="#082B2A" font-size="42" font-weight="900">D</text>
      <text x="180" y="171" text-anchor="middle" fill="#0D2F4F" font-size="26" font-weight="800">DETECTION</text>
      <text x="180" y="207" text-anchor="middle" fill="#536675" font-size="18">How confidently will controls prevent or</text>
      <text x="180" y="234" text-anchor="middle" fill="#536675" font-size="18">detect the cause before exposure?</text>
      <rect x="52" y="260" width="256" height="30" rx="15" fill="#DDF7F4"/>
      <text x="180" y="281" text-anchor="middle" fill="#11655D" font-size="15" font-weight="800">CREDIT ONLY VALIDATED CONTROLS</text>
    </g>
  </g>

  <path d="M250 475 C420 540 500 540 700 505 C900 470 990 505 1150 475" fill="none" stroke="#A8B7C3" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="700" y="535" text-anchor="middle" fill="#0D2F4F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">ENGINEERING RESPONSE LANE</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">
    <rect x="90" y="565" width="270" height="48" rx="24" fill="#E63946"/><text x="225" y="595" text-anchor="middle" fill="#FFFFFF">A • STOP &amp; ESCALATE</text>
    <rect x="405" y="565" width="270" height="48" rx="24" fill="#F0803C"/><text x="540" y="595" text-anchor="middle" fill="#FFFFFF">B • ARCHITECTURE ACTION</text>
    <rect x="720" y="565" width="270" height="48" rx="24" fill="#FFB000"/><text x="855" y="595" text-anchor="middle" fill="#182638">C • DESIGN ACTION</text>
    <rect x="1035" y="565" width="270" height="48" rx="24" fill="#2EC4B6"/><text x="1170" y="595" text-anchor="middle" fill="#082B2A">D • CONTROL &amp; MONITOR</text>
  </g>
</svg>
