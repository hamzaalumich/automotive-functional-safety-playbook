<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Automotive Functional Safety Engineering Playbook</title>
  <desc id="desc">A dark navy engineering banner showing the path from hazard to evidence and three colored risk lenses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162E"/>
      <stop offset="0.55" stop-color="#0D2F4F"/>
      <stop offset="1" stop-color="#125E73"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="0.5" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="460" rx="28" fill="url(#bg)"/>
  <path d="M0 368 C310 300 560 430 870 345 C1130 275 1370 330 1600 250 L1600 460 L0 460 Z" fill="#061326" opacity="0.46"/>
  <path d="M90 350 H1510" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <g transform="translate(86,72)">
    <rect width="104" height="104" rx="24" fill="#EAF7F6" opacity="0.97" filter="url(#shadow)"/>
    <path d="M28 70 V38 L52 24 L76 38 V70 L52 84 Z" fill="none" stroke="#0D2F4F" stroke-width="6"/>
    <circle cx="52" cy="54" r="11" fill="#2EC4B6"/>
    <path d="M52 43 V31 M63 54 H77 M41 54 H27 M60 62 L70 72 M44 62 L34 72" stroke="#0D2F4F" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="225" y="112" fill="#A9E9E2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">ENGINEERING PLAYBOOK</text>
  <text x="225" y="174" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="53" font-weight="800">Automotive Functional Safety</text>
  <text x="225" y="231" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="53" font-weight="800">from hazard to release evidence</text>
  <text x="225" y="282" fill="#D6E8F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Architecture • FMEA / FMEDA • WCCA • Diagnostics • Fault Injection • Safety Case</text>

  <g transform="translate(225,325)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <circle cx="18" cy="18" r="18" fill="#E63946"/>
      <text x="48" y="25" fill="#FFFFFF" font-size="20" font-weight="700">IMPACT</text>
    </g>
    <g transform="translate(210,0)">
      <circle cx="18" cy="18" r="18" fill="#FFB000"/>
      <text x="48" y="25" fill="#FFFFFF" font-size="20" font-weight="700">RECURRENCE</text>
    </g>
    <g transform="translate(485,0)">
      <circle cx="18" cy="18" r="18" fill="#2EC4B6"/>
      <text x="48" y="25" fill="#FFFFFF" font-size="20" font-weight="700">CONTROL CONFIDENCE</text>
    </g>
  </g>

  <g transform="translate(1195,86)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect width="304" height="210" rx="24" fill="#FFFFFF" opacity="0.96"/>
    <text x="30" y="47" fill="#0D2F4F" font-size="18" font-weight="800">SAFETY THREAD</text>
    <g font-size="17" font-weight="700">
      <rect x="30" y="70" width="82" height="34" rx="17" fill="#E63946"/><text x="43" y="93" fill="#fff">Hazard</text>
      <path d="M118 87 H132" stroke="#7A8B9A" stroke-width="3"/><path d="M126 81 L134 87 L126 93" fill="none" stroke="#7A8B9A" stroke-width="3"/>
      <rect x="140" y="70" width="132" height="34" rx="17" fill="#FFB000"/><text x="156" y="93" fill="#182638">Requirement</text>
      <rect x="30" y="124" width="116" height="34" rx="17" fill="#2EC4B6"/><text x="45" y="147" fill="#082B2A">Architecture</text>
      <path d="M152 141 H176" stroke="#7A8B9A" stroke-width="3"/><path d="M170 135 L178 141 L170 147" fill="none" stroke="#7A8B9A" stroke-width="3"/>
      <rect x="184" y="124" width="104" height="34" rx="17" fill="#0D2F4F"/><text x="194" y="147" fill="#fff">Evidence</text>
    </g>
    <text x="30" y="190" fill="#536675" font-size="15">Traceable. Testable. Release-ready.</text>
  </g>
</svg>
